name: Build SUSFS Kernel

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Device model"
        required: true
        default: "g985f"
        type: choice
        options: [g985f, g980f, g988b, g986b, g985f]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex git make gcc libssl-dev python3 zip gpg

      - name: Download AOSP Clang r370808
        run: |
          cd /home/runner
          curl -sL "https://codeload.github.com/AOSP-10-CAF/prebuilts_clang_host_linux-x86_clang-r370808/zip/refs/heads/10" -o clang.zip
          mkdir -p tc/clang10
          unzip -q clang.zip
          mv prebuilts_clang_host_linux-x86_clang-r370808-10/* tc/clang10/ 2>/dev/null || mv prebuilts_clang_host_linux-x86_clang-r370808-10/clang-r370808/* tc/clang10/
          find tc/clang10 -name clang -type f | head -3
          tc/clang10/bin/clang --version | head -1 || echo "CLANG MISSING - will inspect structure"

      - name: Clone GCC 4.9
        run: |
          cd /home/runner
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 tc/gcc49

      - name: Build kernel
        run: |
          CLANG_DIR=/home/runner/tc/clang10 GCC_DIR=/home/runner/tc/gcc49 ./build.sh -m ${{ github.event.inputs.model }}

      - name: Package zip
        run: |
          ./mkzip.sh -m ${{ github.event.inputs.model }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: susfs-kernel-${{ github.event.inputs.model }}
          path: AnyKernel3_KSUNext_SUSFS_*.zip
          if-no-files-found: error
          retention-days: 7
